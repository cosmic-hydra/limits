name: Limits compiler
on:
  push:
    paths: ['compiler/**', 'examples/**', 'tools/**', 'bench/**', '.github/workflows/compiler.yml']
  pull_request:
    paths: ['compiler/**', 'examples/**', 'tools/**', 'bench/**', '.github/workflows/compiler.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            compiler
            examples
            bench
            tools
            .github
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path compiler/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path compiler/Cargo.toml --all-targets -- -D warnings
      - name: Debug tests
        if: matrix.profile == 'debug'
        run: cargo test --manifest-path compiler/Cargo.toml
      - name: Release tests
        if: matrix.profile == 'release'
        run: cargo test --release --manifest-path compiler/Cargo.toml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Agent protocol and LSP integration
        env:
          LIM_BIN: ./compiler/target/${{ matrix.profile == 'release' && 'release' || 'debug' }}/lim${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          python tools/test_agent_cli.py
          python tools/test_limits_lsp.py
  authenticated-encryption:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            compiler
            examples
            bench
      - uses: dtolnay/rust-toolchain@stable
      - name: Install maintained age tools
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Real authenticated-encryption and encrypted CLI tests
        env:
          LIMITS_AGE_BINARY: /usr/bin/age
          LIMITS_AGE_KEYGEN: /usr/bin/age-keygen
        run: cargo test --manifest-path compiler/Cargo.toml --test sealed -- --ignored
