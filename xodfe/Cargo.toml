[package]
name = "xodfe"
version = "0.1.0"
edition = "2021"
description = "XODFe: a validated, single-file model format (tensors + typed metadata + tokenizer) for Limits"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "xodfe"
path = "src/main.rs"

[dependencies]

# Inference tests (tests/parity.rs) are too slow unoptimized.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

# Standalone crate: never join a parent workspace.
[workspace]
